# iOS builds on a GitHub-hosted macOS runner. From no Apple account needed to
# fully signed (see docs/IOS.md for what each one gives you):
#
#   1. simulator  - always runs. Unsigned build for the iOS Simulator. Proves the
#                   project compiles; the .app cannot be installed on an iPhone.
#      unsigned-ipa - runs on pushes. Unsigned device IPA. An iPhone will not
#                   install it as-is; a sideloading tool (Sideloadly, AltStore)
#                   signs it with your Apple ID and installs it.
#   2. signed-ipa - manual run with build_signed_ipa=true. Needs Apple signing
#                   secrets. Produces an .ipa installable on the devices/
#                   distribution channel your provisioning profile allows.
#   3. TestFlight - manual run with upload_to_testflight=true (implies 2). Needs
#                   App Store Connect API key secrets. Uploads to App Store
#                   Connect; it does NOT submit for App Store review.
name: iOS

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      build_signed_ipa:
        description: Build a signed .ipa (requires signing secrets)
        type: boolean
        default: false
      export_method:
        description: Export method matching your provisioning profile
        type: choice
        default: release-testing
        options: [release-testing, app-store-connect, debugging, enterprise]
      upload_to_testflight:
        description: Upload the signed build to TestFlight (requires app-store-connect profile + API key secrets)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  IOS_PROJECT: ios/App/App.xcodeproj
  IOS_SCHEME: App

jobs:
  simulator:
    name: Simulator build (unsigned)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app and sync iOS project
        run: |
          npm run build
          npx cap sync ios

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project "$IOS_PROJECT" \
            -scheme "$IOS_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO \
            build > xcodebuild-sim.log 2>&1 || { grep -E "error:" xcodebuild-sim.log | head -50; tail -80 xcodebuild-sim.log; exit 1; }
          grep -E "BUILD SUCCEEDED" xcodebuild-sim.log
          test -d build/sim/Build/Products/Debug-iphonesimulator/App.app

      - name: Package simulator app
        run: |
          cd build/sim/Build/Products/Debug-iphonesimulator
          zip -qry "$GITHUB_WORKSPACE/HWCollector-simulator.zip" App.app

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: hw-collector-ios-simulator
          path: HWCollector-simulator.zip
          retention-days: 14

  unsigned-ipa:
    name: Unsigned IPA (for sideloading)
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app and sync iOS project
        run: |
          npm run build
          npx cap sync ios

      - name: Archive for device without signing
        run: |
          xcodebuild \
            -project "$IOS_PROJECT" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/HWCollector-unsigned.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive > xcodebuild-unsigned.log 2>&1 || { grep -E "error:" xcodebuild-unsigned.log | head -50; tail -80 xcodebuild-unsigned.log; exit 1; }
          grep -E "ARCHIVE SUCCEEDED" xcodebuild-unsigned.log
          test -d build/HWCollector-unsigned.xcarchive/Products/Applications/App.app

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/HWCollector-unsigned.xcarchive/Products/Applications/App.app build/ipa/Payload/
          cd build/ipa
          zip -qry "$GITHUB_WORKSPACE/HWCollector-unsigned.ipa" Payload
          ls -la "$GITHUB_WORKSPACE/HWCollector-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: hw-collector-ios-unsigned-ipa
          path: HWCollector-unsigned.ipa
          retention-days: 30

  signed-ipa:
    name: Signed IPA
    if: github.event_name == 'workflow_dispatch' && (inputs.build_signed_ipa || inputs.upload_to_testflight)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      EXPORT_METHOD: ${{ inputs.export_method }}
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets are configured
        env:
          P12: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          missing=0
          [ -z "$P12" ] && echo "::error::IOS_CERTIFICATE_P12_BASE64 is not set" && missing=1
          [ -z "$PROFILE" ] && echo "::error::IOS_PROVISIONING_PROFILE_BASE64 is not set" && missing=1
          [ -z "$TEAM" ] && echo "::error::IOS_TEAM_ID is not set" && missing=1
          if [ "$missing" = 1 ]; then echo "See docs/IOS.md 'Signing secrets'."; exit 1; fi

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app and sync iOS project
        run: |
          npm run build
          npx cap sync ios

      - name: Install certificate and provisioning profile
        env:
          P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/profile.mobileprovision" "$dir/$PROFILE_UUID.mobileprovision"
          done
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [ "$EXPORT_METHOD" = "debugging" ]; then IDENTITY="Apple Development"; else IDENTITY="Apple Distribution"; fi
          BUNDLE_ID=$(node -e "console.log(require('./ios/App/App/capacitor.config.json').appId)")
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          xcodebuild \
            -project "$IOS_PROJECT" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/HWCollector.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="$IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive > xcodebuild-archive.log 2>&1 || { grep -E "error:" xcodebuild-archive.log | head -50; tail -80 xcodebuild-archive.log; exit 1; }
          grep -E "ARCHIVE SUCCEEDED" xcodebuild-archive.log
          test -d build/HWCollector.xcarchive

      - name: Export IPA
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>${EXPORT_METHOD}</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/HWCollector.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/ipa
          ls -la build/ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: hw-collector-ios-ipa-${{ inputs.export_method }}
          path: build/ipa/*.ipa
          retention-days: 14

      - name: Upload to TestFlight
        if: inputs.upload_to_testflight
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          if [ "$EXPORT_METHOD" != "app-store-connect" ]; then
            echo "::error::TestFlight needs export_method=app-store-connect and an App Store provisioning profile."
            exit 1
          fi
          if [ -z "$API_KEY_ID" ] || [ -z "$API_ISSUER_ID" ] || [ -z "$API_PRIVATE_KEY" ]; then
            echo "::error::App Store Connect API key secrets are missing. See docs/IOS.md."
            exit 1
          fi
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$API_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
          xcrun altool --upload-app -t ios -f build/ipa/*.ipa --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"

      - name: Clean up signing material
        if: always()
        run: |
          [ -n "$KEYCHAIN" ] && security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP"/*.mobileprovision "$RUNNER_TEMP"/profile.plist
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles"/*.mobileprovision
          rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"/*.mobileprovision
